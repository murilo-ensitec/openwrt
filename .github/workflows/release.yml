name: Build OpenWrt sysupgrade

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.profile }}-${{ matrix.build_type }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        profile: [minimal, full]
        build_type: [debug, release]

    steps:
      - name: Checkout OpenWrt Fork
        uses: actions/checkout@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install bc binutils-gold bison build-essential ccache ecj fastjar file flex g++ gawk gcc-arm* gettext git help2man libbsd-dev libelf-dev liblzma-dev libncurses-dev libssl-dev mtd-utils meson mold mtd-utils ninja-build pbzip2 pigz pkg-config python3-dev python3-setuptools rsync subversion swig texinfo time u-boot-tools unzip wget xsltproc xxd zlib1g-dev zstd

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply configuration
        run: |
          if [ "${{ matrix.profile }}" = "full" ]; then
            echo "Merging optional packages..."
            cat optional_packages.config >> .config
          fi
          
          make defconfig

      - name: Inject Custom Files (Password)
        run: |
          # Only inject the custom shadow file for release builds
          if [ "${{ matrix.build_type }}" = "release" ]; then
            echo "Injecting shadow.release for password protection..."
            mkdir -p files/etc
            cp shadow.release files/etc/shadow
          fi
          # Debug builds will skip this step and use the password-less OpenWrt default

      - name: Download package sources
        run: make download -j8

      - name: Compile firmware
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: Gather and rename sysupgrade binaries
        run: |
          mkdir release_assets
          find bin/targets/ -name "*sysupgrade*" -type f | while read file; do
            filename=$(basename "$file")
            extension="${filename##*.}"
            basename="${filename%.*}"
            
            # Example output: openwrt-ath79-generic-squashfs-sysupgrade-minimal-release.bin
            new_filename="${basename}-${{ matrix.profile }}-${{ matrix.build_type }}.${extension}"
            cp "$file" "release_assets/$new_filename"
          done

      - name: Upload Binary to Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          append_body: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
