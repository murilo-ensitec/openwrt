name: Build OpenWrt sysupgrade

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.profile }}-${{ matrix.build_type }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        profile: [minimal, full]
        build_type: [debug, release]

    steps:
      - name: Checkout OpenWrt Fork
        uses: actions/checkout@v4

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply configuration
        run: |
          if [ "${{ matrix.profile }}" = "full" ]; then
            echo "Merging optional packages..."
            cat optional_packages.config >> .config
          fi
          
          make defconfig

      - name: Inject Custom Files (Password)
        run: |
          # Only inject the custom shadow file for release builds
          if [ "${{ matrix.build_type }}" = "release" ]; then
            echo "Injecting shadow.release for password protection..."
            mkdir -p files/etc
            cp shadow.release files/etc/shadow
          fi
          # Debug builds will skip this step and use the password-less OpenWrt default

      - name: Download package sources
        run: make download -j8

      - name: Compile firmware
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: Gather and rename sysupgrade binaries
        run: |
          mkdir release_assets
          find bin/targets/ -name "*sysupgrade*" -type f | while read file; do
            filename=$(basename "$file")
            extension="${filename##*.}"
            basename="${filename%.*}"
            
            # Example output: openwrt-ath79-generic-squashfs-sysupgrade-minimal-release.bin
            new_filename="${basename}-${{ matrix.profile }}-${{ matrix.build_type }}.${extension}"
            cp "$file" "release_assets/$new_filename"
          done

      - name: Upload Binary to Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          append_body: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
